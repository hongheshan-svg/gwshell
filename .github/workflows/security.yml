name: Security audit

# Runs cargo audit + npm audit on every PR (strict — fails on warnings) and
# weekly on schedule (warning-only — opens an issue but doesn't fail).
on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # On PRs: fail hard on any advisory. On schedule: warn but don't fail
      # (the weekly run is informational — it surfaces drift without blocking).
      - name: Cargo audit (strict on PR, warning-only on schedule)
        working-directory: src-tauri
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo audit --deny warnings
          else
            cargo audit || true
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # npm audit for production deps only, high+ severity. Strict on PRs
      # (fails the check, mirroring the cargo-audit policy above); warning-only
      # on the weekly schedule so drift is surfaced without blocking.
      - name: npm audit (high+ only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm audit --omit=dev --audit-level=high
          else
            npm audit --omit=dev --audit-level=high || true
          fi
