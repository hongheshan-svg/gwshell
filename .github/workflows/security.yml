name: Security audit

# Runs cargo audit + npm audit on every PR (strict — fails on warnings) and
# weekly on schedule (warning-only — informational without blocking).
on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Prebuilt cargo-audit binary (seconds) instead of `cargo install`
      # compiling it from source (~3-4 min). cargo-audit only reads
      # Cargo.lock, so no Rust toolchain setup is needed.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # On PRs: fail hard on any advisory NOT in the ignore list (below).
      # On schedule: warn but don't fail (weekly run is informational).
      #
      # The ignore list suppresses advisories on TRANSITIVE deps that GWShell
      # cannot fix without forking upstream (Tauri's GTK3/zbus transitive deps,
      # russh-sftp's chrono). Each ignored ID has a rationale + re-triage date in
      # `src-tauri/audit.toml`. Review quarterly; remove entries when upstream
      # fixes land.
      - name: Cargo audit (strict on PR, warning-only on schedule)
        working-directory: src-tauri
        run: |
          IGNORES=(
            --ignore RUSTSEC-2024-0429   # glib unsound (GTK3 transitive via tauri)
            --ignore RUSTSEC-2026-0543   # chrono unmaintained (transitive via russh-sftp)
            --ignore RUSTSEC-2026-0441   # pin-utils unmaintained (transitive via futures-util)
            --ignore RUSTSEC-2026-0370   # zvariant unmaintained (transitive via zbus <- tauri plugins)
            --ignore RUSTSEC-2026-0371   # zbus_names unmaintained (transitive via zbus)
            --ignore RUSTSEC-2026-0372   # zvariant_derive unmaintained (transitive via zbus)
            --ignore RUSTSEC-2024-0411   # gdkwayland-sys unmaintained (GTK3 via webkit2gtk)
            --ignore RUSTSEC-2024-0412   # gdk unmaintained (GTK3)
            --ignore RUSTSEC-2024-0413   # atk unmaintained (GTK3)
            --ignore RUSTSEC-2024-0414   # gdkx11-sys unmaintained (GTK3)
            --ignore RUSTSEC-2024-0415   # gtk unmaintained (GTK3)
            --ignore RUSTSEC-2024-0416   # atk-sys unmaintained (GTK3)
            --ignore RUSTSEC-2024-0417   # gdkx11 unmaintained (GTK3)
            --ignore RUSTSEC-2024-0418   # gdk-sys unmaintained (GTK3)
            --ignore RUSTSEC-2024-0419   # gtk3-macros unmaintained (GTK3)
            --ignore RUSTSEC-2024-0420   # gtk-sys unmaintained (GTK3)
            --ignore RUSTSEC-2025-0057   # fxhash unmaintained (transitive)
            --ignore RUSTSEC-2024-0370   # proc-macro-error unmaintained (transitive)
            --ignore RUSTSEC-2017-0008   # serial crate unmaintained (transitive; we use serialport)
            --ignore RUSTSEC-2025-0081   # unic-char-property unmaintained (transitive)
            --ignore RUSTSEC-2025-0075   # unic-char-range unmaintained (transitive)
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Deny unmaintained + unsound (ignoring transitive GTK3/Tauri deps
            # we can't fix). Yanked crates are NOT denied on PRs because some
            # have no advisory ID (can't be --ignore'd); they surface as
            # warnings instead and are tracked via the weekly run.
            cargo audit --deny unmaintained --deny unsound "${IGNORES[@]}"
          else
            cargo audit "${IGNORES[@]}" || true
          fi

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Audit directly from package-lock.json (--package-lock-only) without
      # downloading node_modules via `npm ci`. Production deps only, high+
      # severity: strict on PRs, warning-only on weekly schedule.
      - name: npm audit (high+ only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm audit --package-lock-only --omit=dev --audit-level=high
          else
            npm audit --package-lock-only --omit=dev --audit-level=high || true
          fi
