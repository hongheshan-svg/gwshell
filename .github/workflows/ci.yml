name: CI

# Pre-merge safety net.
#
#   changes   – PR path filter so frontend-only / backend-only PRs skip
#               unaffected jobs (pushes to main & manual runs execute all jobs).
#   frontend  – format, lint, type-check + vite build, smoke wiring check,
#               node tests (single Linux runner).
#   rust-fmt  – rustfmt once on Linux (formatting is platform-independent).
#   backend   – 3-OS matrix: clippy (-D warnings) + tests. Skips Node/npm
#               because tauri's build.rs only needs `../dist` to exist.
#
# The heavy Tauri bundling build lives in release.yml (tags / manual only).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  NODE_VERSION: 22

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'scripts/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'eslint.config.*'
              - '.prettierrc.json'
              - '.prettierignore'
              # smoke:check cross-validates frontend invokes against lib.rs
              # and capabilities, so backend wiring changes re-run it too.
              - 'src-tauri/src/**'
              - 'src-tauri/capabilities/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (format, lint, build, smoke, tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cheap static checks first so trivial mistakes fail in seconds.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # `npm run build` = tsc (type-check) + vite build.
      - name: Build frontend (type-check)
        run: npm run build

      - name: Smoke check
        run: npm run smoke:check

      - name: Node tests
        run: npm run test:node

  rust-fmt:
    name: Rust format
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

  backend:
    name: Backend (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo registry + src-tauri/target per OS + Cargo.lock.
      # GitHub Actions isolates PR branch caches automatically from main.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: backend-${{ matrix.os }}

      # Linux: system libs the tauri/-sys crates link against. No OpenSSL or
      # libssh2 needed (russh + rustls are pure Rust).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libdbus-1-dev \
            pkg-config

      # tauri's build.rs / generate_context! require `frontendDist` (../dist)
      # to exist. clippy and tests never serve it, so a stub is sufficient and
      # lets this job skip Node/npm entirely.
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p dist
          echo '<!doctype html><html><body></body></html>' > dist/index.html

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked
