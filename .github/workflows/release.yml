name: Release

# Heavy 3-platform build + release. Runs ONLY on version tags (v*) or manual
# dispatch — everyday pushes/PRs are covered by the fast checks in ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel an in-flight tag release; allow cancelling superseded manual runs.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  NODE_VERSION: 22

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          # Linux x86_64 (ubuntu-22.04 keeps glibc compatible with older distros)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          # macOS ARM64 (Apple Silicon)
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.label }}

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-node-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-cmd: 'node_modules/.bin/tauri --version >/dev/null 2>&1'

      # Linux-specific system dependencies (patchelf needed by AppImage bundler;
      # no OpenSSL or libssh2 needed since russh + rustls are pure Rust).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libudev-dev \
            libdbus-1-dev

      # Extract this version's section from CHANGELOG.md so the GitHub Release
      # body is version-specific (matched by the pushed tag, e.g. v0.2.0 ->
      # the "## v0.2.0 - ..." section). Falls back to a generic line if absent.
      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BODY=""
          if [ -f CHANGELOG.md ]; then
            BODY="$(awk -v ver="v$VER" '
              $0 ~ ("^## " ver "([^0-9]|$)") { cap = 1; next }
              cap && /^## v/ { exit }
              cap { print }
            ' CHANGELOG.md)"
          fi
          # Drop leading blank lines.
          BODY="$(printf '%s\n' "$BODY" | sed -e '/./,$!d')"
          if [ -z "$BODY" ]; then
            BODY="See the assets to download this version and install."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Generate a CycloneDX SBOM once (Linux tag builds only) using a prebuilt
      # binary instead of compiling cargo-cyclonedx from source on all 3 OSes.
      - name: Install cargo-cyclonedx
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        working-directory: src-tauri
        run: cargo cyclonedx --format json

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # Only create/upload a GitHub Release on tag pushes (v*). On manual
          # workflow_dispatch runs tagName/releaseName are empty, so tauri-action
          # just builds — the binaries are still kept via the upload-artifact
          # step below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'GWShell v__VERSION__' || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Create portable zip (Windows only)
      - name: Create Portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/GWShell.exe" -ErrorAction SilentlyContinue
          if ($exe) {
            Compress-Archive -Path $exe.FullName -DestinationPath "src-tauri/target/${{ matrix.target }}/release/GWShell-portable-${{ matrix.label }}.zip"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: gwshell-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis.zip.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/GWShell-portable-*.zip
          if-no-files-found: warn

      # Upload the CycloneDX SBOM to the GitHub Release (Linux tag pushes only,
      # avoiding a 3-way race uploading the same filename from all OS runners).
      - name: Upload SBOM to release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/*.cdx.json
          tag_name: ${{ github.ref_name }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload portable ZIP to the GitHub Release (Windows only)
      - name: Upload Portable ZIP to Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/${{ matrix.target }}/release/GWShell-portable-${{ matrix.label }}.zip
          tag_name: ${{ github.ref_name }}
          # Keep the release a draft (tauri-action created it with releaseDraft:
          # true). Without this, action-gh-release defaults to draft:false and
          # would publish the release before it can be reviewed.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
